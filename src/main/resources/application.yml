spring:
  application:
    name: splitwise-lite
  datasource:
    url: jdbc:h2:file:./data/splitwise;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: splitwise-lite-dev-secret-key-change-me-in-production-32chars
    expiration-ms: 86400000

logging:
  level:
    org.springframework.security: INFO
